[project]
name = "srtshift"
version = "1.0.0"
description = "Shift subtitle timelines and convert between srt/ass/vtt. Stdlib only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
srtshift = "srtshift:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
